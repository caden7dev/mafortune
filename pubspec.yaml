name: mafortune
description: "Application de gestion financière pour les commerçants du secteur informel au Togo"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # UI
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.2

  # URLs & Storage
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Charts & PDF
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^24.2.9
  intl: ^0.19.0
  pdf: ^3.10.7
  printing: ^5.11.1

  # Biometrics & Images
  local_auth: ^2.1.6
  image_picker: ^1.0.0

  # Network & Offline
  connectivity_plus: ^6.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  workmanager: ^0.9.0+3
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.8
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # State Management
  provider: ^6.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logoapp.jpg"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/logoapp.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/image/commercant1.jpeg